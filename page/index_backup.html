
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Projects | Tech Utility</title>
  <!-- Three.js for the interactive 3D background -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    :root {
      /* Deep aesthetic dark theme with vibrant emerald/teal accents */
      --bg: oklch(10% 0.02 160);
      --fg: oklch(98% 0.005 160);
      --muted: oklch(70% 0.02 160);
      --accent: oklch(75% 0.15 150); /* Bright green */
      
      /* Advanced Glassmorphism variables */
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-highlight: rgba(255, 255, 255, 0.2);

      --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* 3D Background Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Advanced Glassmorphism utility */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.4), inset 0 1px 1px var(--glass-highlight);
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 40px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      background: linear-gradient(to bottom, rgba(15, 17, 21, 0.6), rgba(15, 17, 21, 0.2));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .logo {
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: -0.05em;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
    }
    .logo span {
      color: var(--accent);
    }

    /* Main Content */
    main {
      padding-top: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .hero-text {
      text-align: center;
      margin-bottom: 60px;
    }
    .hero-text h1 {
      font-family: var(--font-display);
      font-size: 3.5rem;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      text-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    .hero-text p {
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* Slider Container */
    .slider-container {
      width: 100vw;
      overflow: hidden;
      padding: 20px 0 30px;
    }

    .track {
      display: flex;
      gap: 32px;
      width: max-content;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Cards */
    .card {
      width: 360px;
      height: 202px;
      perspective: 1000px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d; /* Safe because glass is on children */
      border-radius: 16px;
    }

    .card:hover .card-front, .card:hover .card-back {
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(74, 222, 128, 0.1), inset 0 1px 1px var(--glass-highlight);
    }
    
    .card:hover .card-inner {
      transform: translateY(-4px);
    }
    .card.flipped:hover .card-inner {
      transform: rotateY(180deg) translateY(-4px);
    }
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Apply glass styles to individual faces to preserve 3D context */
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    .card-front {
      display: flex;
      flex-direction: column;
    }

    .card-front video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
      transition: opacity 0.5s ease;
    }

    .card-front.is-playing video {
      opacity: 0.9;
    }

    .card-front:hover video {
      opacity: 1;
    }

    .card-front-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
    }
    .card-front-overlay h3 {
      font-family: var(--font-mono);
      font-size: 1rem;
      margin-bottom: 4px;
      color: #fff;
    }
    .card-front-overlay p {
      color: rgba(255,255,255,0.7);
      font-size: 0.8rem;
    }

    .card-back {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card-back h3 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
    }

    .card-back p {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .btn {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(74, 222, 128, 0.1);
      color: var(--fg);
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 15px var(--accent);
    }

    /* Timer Progress Bar */
    .progress-wrapper {
      width: 100%;
      max-width: 1200px;
      padding: 0 40px;
      margin-top: 10px;
      margin-bottom: 40px;
    }

    .progress-container {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      box-shadow: 0 0 12px var(--accent);
      will-change: width;
      border-radius: 8px;
    }

    /* Overlay for expanded card */
    #overlay-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(12px);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #overlay-bg.active {
      opacity: 1;
      pointer-events: auto;
    }

    .close-btn {
      position: absolute;
      top: 40px;
      right: 40px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 102;
      pointer-events: none;
    }
    .close-btn:hover {
      background: rgba(255,255,255,0.1);
      transform: scale(1.1);
    }
    .close-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .clone-active {
      position: fixed !important;
      z-index: 100 !important;
      transition: all 0.7s cubic-bezier(0.25, 1, 0.4, 1) !important;
      margin: 0 !important;
    }
    
    .hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-family: var(--font-mono);
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
    }
    .clone-active .hint {
      opacity: 1;
    }
    .card.flipped .hint {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <header>
    <div class="logo">SYS<span>.</span>OP</div>
    <a href="#" class="btn" style="padding: 8px 16px; border-color: rgba(255,255,255,0.2); color: #fff;">Connect</a>
  </header>

  <main>
    <div class="hero-text">
      <h1>Active Modules</h1>
      <p>Continuous integration. Click to expand telemetry.</p>
    </div>

    <div class="slider-container">
      <div class="track" id="track">
        <!-- Cards generated by JS -->
      </div>
    </div>
    
    <div class="progress-wrapper">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </main>

  <div id="overlay-bg"></div>
  <button class="close-btn" id="close-btn">&times;</button>

  <script>
    // ----------------------------------------------------
    // 1. Aesthetic 3D Background with Sci-Fi Floating Drone
    // ----------------------------------------------------
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06080a, 0.025);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Grid Floor
    const gridHelper = new THREE.GridHelper(100, 100, 0x4ade80, 0x111111);
    gridHelper.position.y = -5;
    gridHelper.material.opacity = 0.15;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00aaff, 1);
    dirLight.position.set(-10, 10, 5);
    scene.add(dirLight);

    // --- The Blocky LED Robot Construction ---
    const robot = new THREE.Group();
    
    // Robot materials
    const bodyMat = new THREE.MeshPhysicalMaterial({ 
      color: 0x12141a, 
      metalness: 0.8, 
      roughness: 0.3,
      clearcoat: 0.5,
    });
    
    const screenMat = new THREE.MeshBasicMaterial({ color: 0x000000 }); // Will be replaced by canvas texture

    // Canvas for LED Face
    const faceCanvas = document.createElement('canvas');
    faceCanvas.width = 512;
    faceCanvas.height = 256;
    const faceCtx = faceCanvas.getContext('2d');
    const faceTexture = new THREE.CanvasTexture(faceCanvas);
    
    // Initialize blank screen
    faceCtx.fillStyle = '#000000';
    faceCtx.fillRect(0, 0, 512, 256);
    faceTexture.needsUpdate = true;
    
    const ledScreenMat = new THREE.MeshBasicMaterial({ map: faceTexture });

    // 1. Robot Head (Blocky)
    const headGroup = new THREE.Group();
    const headGeo = new THREE.BoxGeometry(2, 1.5, 1.5);
    const head = new THREE.Mesh(headGeo, bodyMat);
    headGroup.add(head);
    
    // Screen on the front of the head
    const screenGeo = new THREE.PlaneGeometry(1.8, 1.2);
    const screen = new THREE.Mesh(screenGeo, ledScreenMat);
    screen.position.z = 0.76; // Slightly in front of the head box
    headGroup.add(screen);
    
    robot.add(headGroup);

    // 2. Robot Body (Floating below head)
    const bodyGroup = new THREE.Group();
    const bodyGeo = new THREE.BoxGeometry(1.5, 2, 1);
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyGroup.position.y = -2;
    bodyGroup.add(bodyMesh);
    robot.add(bodyGroup);

    // Position robot deeply in the background
    robot.position.set(0, 1, -12);
    scene.add(robot);
    camera.position.z = 10;
    
    // --- Face Boot Sequence & Mood Logic ---
    let currentMood = 'booting';
    let bootStep = 0;
    
    function drawFaceText(text, size = '40px') {
      faceCtx.fillStyle = '#000000';
      faceCtx.fillRect(0, 0, 512, 256);
      faceCtx.fillStyle = '#4ade80'; // Emerald/Teal accent
      faceCtx.font = `${size} "JetBrains Mono", monospace`;
      faceCtx.textAlign = 'center';
      faceCtx.textBaseline = 'middle';
      faceCtx.shadowColor = '#4ade80';
      faceCtx.shadowBlur = 10;
      faceCtx.fillText(text, 256, 128);
      faceCtx.shadowBlur = 0; // Reset
      faceTexture.needsUpdate = true;
    }
    
    function drawEyes(mood) {
      faceCtx.fillStyle = '#000000';
      faceCtx.fillRect(0, 0, 512, 256);
      faceCtx.fillStyle = '#4ade80';
      faceCtx.shadowColor = '#4ade80';
      faceCtx.shadowBlur = 15;
      
      // Left eye pos: (128, 128), Right eye pos: (384, 128)
      if (mood === 'neutral' || mood === 'booting_done') {
        // Normal eyes
        faceCtx.fillRect(80, 80, 80, 60);
        faceCtx.fillRect(352, 80, 80, 60);
      } else if (mood === 'happy') {
        // Happy eyes (curved/smaller)
        faceCtx.fillRect(80, 100, 80, 30);
        faceCtx.fillRect(352, 100, 80, 30);
        // Add a slight arc/curve if desired, but rectangles are fine for LED look
      } else if (mood === 'focused') {
        // Angry/Focused eyes
        faceCtx.beginPath();
        faceCtx.moveTo(80, 80); faceCtx.lineTo(160, 100); faceCtx.lineTo(160, 120); faceCtx.lineTo(80, 120);
        faceCtx.fill();
        faceCtx.beginPath();
        faceCtx.moveTo(432, 80); faceCtx.lineTo(352, 100); faceCtx.lineTo(352, 120); faceCtx.lineTo(432, 120);
        faceCtx.fill();
      } else if (mood === 'surprised') {
        // Wide eyes
        faceCtx.fillRect(90, 60, 60, 90);
        faceCtx.fillRect(362, 60, 60, 90);
      } else if (mood === 'loading') {
        // Dots
        const time = Date.now() * 0.005;
        const offset = Math.sin(time) * 20;
        faceCtx.fillRect(110, 110 + offset, 30, 30);
        faceCtx.fillRect(372, 110 - offset, 30, 30);
      }
      
      faceCtx.shadowBlur = 0;
      faceTexture.needsUpdate = true;
    }

    // Run Boot Sequence
    setTimeout(() => { drawFaceText("Initialize Protocol", '30px'); }, 1000);
    setTimeout(() => { drawFaceText("System On"); }, 2500);
    setTimeout(() => { currentMood = 'neutral'; }, 4000);

    // Dust particles
    const particlesGeo = new THREE.BufferGeometry();
    const pCount = 500;
    const pPos = new Float32Array(pCount * 3);
    for(let i = 0; i < pCount * 3; i++) {
      pPos[i] = (Math.random() - 0.5) * 40;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const particlesMat = new THREE.PointsMaterial({
      size: 0.05,
      color: 0x4ade80,
      transparent: true,
      opacity: 0.4,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);

    // Mouse tracking setup
    let mouseX = 0; 
    let mouseY = 0;
    
    document.addEventListener('mousemove', (event) => {
      // Normalize mouse coordinates to -1 to 1
      mouseX = (event.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    const clock = new THREE.Clock();

    function animateBg() {
      requestAnimationFrame(animateBg);
      const elapsedTime = clock.getElapsedTime();

      // Robot hover (bobbing)
      robot.position.y = Math.sin(elapsedTime * 1.2) * 0.4 + 1;
      
      // Robot Body Tracks cursor slowly
      const targetBodyX = -mouseY * 0.4;
      const targetBodyY = mouseX * 0.6;
      robot.rotation.x += (targetBodyX - robot.rotation.x) * 0.03;
      robot.rotation.y += (targetBodyY - robot.rotation.y) * 0.03;

      // Update face if mood is loading (for animation) or otherwise draw current mood
      if (currentMood !== 'booting') {
         drawEyes(currentMood);
      }

      // Dust animation
      particles.rotation.y = elapsedTime * 0.02;

      // Parallax effect on the camera itself
      camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
      camera.position.y += (mouseY * 1 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, -10);

      renderer.render(scene, camera);
    }
    animateBg();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----------------------------------------------------
    // 2. Generate Cards Data (Simulated Markdown Data)
    // ----------------------------------------------------
    const projectData = [
      { id: '001', title: 'Aether Engine', desc: 'Real-time volumetric simulation interface.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', link: 'https://example.com/aether', robot_mood: 'happy' },
      { id: '002', title: 'Nexus Protocol', desc: 'Distributed node visualization system.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', link: 'https://example.com/nexus', robot_mood: 'focused' },
      { id: '003', title: 'Oblivion DB', desc: 'High-frequency transactional data store.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', link: 'https://example.com/oblivion', robot_mood: 'surprised' },
      { id: '004', title: 'Solaris API', desc: 'Secure gateway routing dashboard.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', link: 'https://example.com/solaris', robot_mood: 'focused' },
      { id: '005', title: 'Hyperion UI', desc: 'Data-dense monitoring environment.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4', link: 'https://example.com/hyperion', robot_mood: 'happy' },
      { id: '006', title: 'Echo Sequence', desc: 'Automated log analytics pipeline.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4', link: 'https://example.com/echo', robot_mood: 'loading' },
      { id: '007', title: 'Vanguard OS', desc: 'Embedded systems deployment tool.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', link: 'https://example.com/vanguard', robot_mood: 'surprised' },
      { id: '008', title: 'Cygnus Link', desc: 'Peer-to-peer encryption protocol.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', link: 'https://example.com/cygnus', robot_mood: 'focused' },
      { id: '009', title: 'Apex Matrix', desc: 'Neural network inference viewer.', video: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', link: 'https://example.com/apex', robot_mood: 'happy' },
    ];

    const track = document.getElementById('track');
    
    // Fix: the .glass class is applied to .card-front and .card-back individually to avoid breaking preserve-3d!
    function createCardHTML(data) {
      return `
        <div class="card" data-id="${data.id}" data-mood="${data.robot_mood}">
          <div class="card-inner">
            <div class="card-front glass">
              <video src="${data.video}" loop muted playsinline crossorigin="anonymous" preload="none"></video>
              <div class="card-front-overlay">
                <h3>MOD // ${data.id}</h3>
                <p>${data.title}</p>
              </div>
              <div class="hint">CLICK TO FLIP</div>
            </div>
            <div class="card-back glass">
              <h3>${data.title}</h3>
              <p>${data.desc}<br><br>Status: Online</p>
              <a href="${data.link}" target="_blank" class="btn" onclick="event.stopPropagation();">Initialize Sequence</a>
            </div>
          </div>
        </div>
      `;
    }

    let html = '';
    projectData.forEach(p => html += createCardHTML(p));
    projectData.forEach(p => html += createCardHTML(p));
    track.innerHTML = html;

    // ----------------------------------------------------
    // 3. Sliding Logic & Video Observer
    // ----------------------------------------------------
    const cards = document.querySelectorAll('.card');
    const CARD_WIDTH = 360;
    const CARD_GAP = 32;
    const SET_SIZE = projectData.length;
    let currentIndex = 0;
    let isHoveringTrack = false;

    track.addEventListener('mouseenter', () => isHoveringTrack = true);
    track.addEventListener('mouseleave', () => isHoveringTrack = false);

    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        const front = entry.target.querySelector('.card-front');
        if (entry.isIntersecting) {
          front.classList.add('is-playing');
          video.play().catch(() => {});
        } else {
          front.classList.remove('is-playing');
          video.pause();
        }
      });
    }, { threshold: 0.6 });

    cards.forEach(card => videoObserver.observe(card));

    // Time Bar Logic
    const SLIDE_DURATION = 10000;
    const progressBar = document.getElementById('progress-bar');
    let timeElapsed = 0;
    let lastTime = performance.now();

    function slideToNext() {
      const cardsVisible = Math.max(1, Math.floor(window.innerWidth / (CARD_WIDTH + CARD_GAP)));
      currentIndex += cardsVisible;

      if (currentIndex >= SET_SIZE) {
        track.style.transition = 'transform 1.2s cubic-bezier(0.25, 1, 0.5, 1)';
        track.style.transform = `translateX(-${currentIndex * (CARD_WIDTH + CARD_GAP)}px)`;
        
        setTimeout(() => {
          track.style.transition = 'none';
          currentIndex = currentIndex % SET_SIZE;
          track.style.transform = `translateX(-${currentIndex * (CARD_WIDTH + CARD_GAP)}px)`;
        }, 1200); 
      } else {
        track.style.transition = 'transform 1.2s cubic-bezier(0.25, 1, 0.5, 1)';
        track.style.transform = `translateX(-${currentIndex * (CARD_WIDTH + CARD_GAP)}px)`;
      }
    }

    function updateTimer(currentTime) {
      let deltaTime = currentTime - lastTime;
      if (deltaTime > 1000) deltaTime = 1000; 
      lastTime = currentTime;

      if (!activeClone && !isHoveringTrack) {
        timeElapsed += deltaTime;
        
        if (timeElapsed >= SLIDE_DURATION) {
          timeElapsed = 0;
          slideToNext();
        }
      }

      const progressPercent = (timeElapsed / SLIDE_DURATION) * 100;
      progressBar.style.width = `${progressPercent}%`;

      requestAnimationFrame(updateTimer);
    }

    requestAnimationFrame(updateTimer);

    // ----------------------------------------------------
    // 4. Interaction Logic (Expand -> Flip)
    // ----------------------------------------------------
    const overlayBg = document.getElementById('overlay-bg');
    const closeBtn = document.getElementById('close-btn');
    let activeClone = null;
    let originalCard = null;

    cards.forEach(card => {
      card.addEventListener('mouseenter', function() {
         const mood = this.getAttribute('data-mood');
         if (mood && currentMood !== 'booting') {
            currentMood = mood;
         }
      });
      card.addEventListener('mouseleave', function() {
         if (currentMood !== 'booting') {
            currentMood = 'neutral';
         }
      });
      card.addEventListener('click', function(e) {
        if (activeClone) return;

        originalCard = this;
        const rect = originalCard.getBoundingClientRect();
        
        activeClone = originalCard.cloneNode(true);
        activeClone.classList.add('clone-active');
        
        activeClone.style.top = rect.top + 'px';
        activeClone.style.left = rect.left + 'px';
        activeClone.style.width = rect.width + 'px';
        activeClone.style.height = rect.height + 'px';

        document.body.appendChild(activeClone);
        
        originalCard.style.opacity = '0';
        overlayBg.classList.add('active');
        closeBtn.classList.add('active');

        requestAnimationFrame(() => {
          activeClone.style.top = '50%';
          activeClone.style.left = '50%';
          
          const scaleFactor = window.innerWidth < 768 ? 1.05 : 1.8;
          activeClone.style.transform = `translate(-50%, -50%) scale(${scaleFactor})`;
          
          // Elevate the glass shadow for the expanded state on both faces
          const front = activeClone.querySelector('.card-front');
          const back = activeClone.querySelector('.card-back');
          front.style.boxShadow = '0 30px 60px rgba(0,0,0,0.8), 0 0 30px rgba(74,222,128,0.2), inset 0 1px 1px var(--glass-highlight)';
          back.style.boxShadow = '0 30px 60px rgba(0,0,0,0.8), 0 0 30px rgba(74,222,128,0.2), inset 0 1px 1px var(--glass-highlight)';
          
          const video = activeClone.querySelector('video');
          if (video) {
            activeClone.querySelector('.card-front').classList.add('is-playing');
            video.currentTime = 0;
            video.play().catch(() => {});
          }
        });

        activeClone.addEventListener('click', function() {
          this.classList.toggle('flipped');
        });
      });
    });

    function closeExpanded() {
      if (!activeClone || !originalCard) return;

      const rect = originalCard.getBoundingClientRect();
      
      const video = activeClone.querySelector('video');
      if (video) video.pause();

      activeClone.classList.remove('flipped');
      overlayBg.classList.remove('active');
      closeBtn.classList.remove('active');

      activeClone.style.top = rect.top + 'px';
      activeClone.style.left = rect.left + 'px';
      activeClone.style.transform = 'translate(0, 0) scale(1)';
      
      const front = activeClone.querySelector('.card-front');
      const back = activeClone.querySelector('.card-back');
      front.style.boxShadow = '';
      back.style.boxShadow = '';

      setTimeout(() => {
        if (activeClone) {
          activeClone.remove();
          activeClone = null;
        }
        if (originalCard) {
          originalCard.style.opacity = '1';
          originalCard = null;
        }
      }, 700);
    }

    closeBtn.addEventListener('click', closeExpanded);
    overlayBg.addEventListener('click', closeExpanded);

  </script>
</body>
